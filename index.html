<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalista</title>
  <meta name="theme-color" content="#262b33">
  <meta name="description" content="Kalista: programma libero per disegnare planimetrie 2D, con i comandi di DraftSight e AutoCAD.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(42 16 16)'%3E%3Cpath d='M15.45 11.5h1.1v19l-.55 1.5-.55-1.5z' fill='%237fd0f5'/%3E%3Cpath d='M16-1.5l1.9 9-1 3.2h2.3l-.9 1.3h-4.6l-.9-1.3h2.3l-1-3.2z' fill='%23d6f4ff'/%3E%3C/g%3E%3Cpath d='M17.5 1.5c.9 5.2-2.3 7.6-4.9 10.9C10.3 15.3 8 18 8 21.5a8.3 8.3 0 0 0 16.6 0c0-3.3-1.5-5.6-2.8-7.3-.4 2.1-1.3 3.3-2.9 3.9 1.3-5.3.2-12-1.4-16.6z' fill='%231e6bff'/%3E%3Cpath d='M16.2 29.5a4.6 4.6 0 0 0 4.6-4.6c0-2.7-2.1-3.8-3.2-6.4-2 1.7-6 3.6-6 6.4a4.6 4.6 0 0 0 4.6 4.6z' fill='%23c9ecff'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header id="toolbar"></header>
    <main id="main">
      <div id="canvas-wrap">
        <canvas id="base"></canvas>
        <canvas id="overlay"></canvas>
        <div id="tip"></div>
      </div>
      <aside id="side">
        <section id="props-panel" class="panel">
          <h2>Proprietà</h2>
          <div id="props"></div>
        </section>
        <section id="layers-panel" class="panel">
          <h2>Layer</h2>
          <div id="layers"></div>
        </section>
      </aside>
    </main>
    <section id="cmd">
      <div id="history"></div>
      <div id="cmdline">
        <span id="prompt"></span>
        <input id="cmdinput" autocomplete="off" spellcheck="false" aria-label="Riga di comando">
        <div id="suggest"></div>
      </div>
    </section>
    <footer id="status"></footer>
  </div>
  <div id="dialog-root"></div>
  <div id="print-root"></div>
  <input type="file" id="file-input" hidden>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
